# This file generates the GitHub Actions matrix.
#
# Dongle-as-central setup:
#   - The dongle (XIAO nRF52840 + ST7789 LCD) is the CENTRAL and holds the keymap.
#   - Both Corne halves are PERIPHERALS (forced via cmake-args).
#   - Display comes from the zmk-dongle-screen (YADS) module, shield `dongle_screen`.
#
# Pinned to ZMK v0.3, so board targets use the pre-Zephyr-4.1 names.
---
include:
  # --- Dongle = central (holds the keymap + Studio + display) ---
  - board: seeeduino_xiao_ble
    shield: clover_dongle dongle_screen
    snippet: studio-rpc-usb-uart

  # --- Corne halves = peripherals ---
  - board: nice_nano_v2
    shield: corne_left
    cmake-args: -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
  - board: nice_nano_v2
    shield: corne_right
    cmake-args: -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n

  # --- Reset firmware (only needed to clear BLE bonds) ---
  - board: nice_nano_v2
    shield: settings_reset
  - board: seeeduino_xiao_ble
    shield: settings_reset
