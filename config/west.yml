manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: bwshockley
      url-base: https://github.com/bwshockley
  projects:
    # ZMK main (Zephyr 4.1). zmk-dongle-screen uses the `zephyr,mipi-dbi-spi`
    # display binding, which does not exist in Zephyr 3.5, so v0.3 is not an
    # option here. Keep .github/workflows/build.yml pinned to @main to match.
    - name: zmk
      remote: zmkfirmware
      revision: main
      import: app/west.yml
    - name: zmk-dongle-screen
      remote: bwshockley
      revision: main
  self:
    path: config
