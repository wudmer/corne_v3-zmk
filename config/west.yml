manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: janpfischer
      url-base: https://github.com/janpfischer
  projects:
    # Pinned to the stable v0.3 release (Zephyr 3.5). zmk-dongle-screen (YADS)
    # officially targets 0.3.0 and its ST7789 overlay uses the Zephyr 3.5
    # `sitronix,st7789v` binding, so do not move this to main without checking
    # the module first. Keep .github/workflows/build.yml pinned to @v0.3 to match.
    - name: zmk
      remote: zmkfirmware
      revision: v0.3
      import: app/west.yml
    - name: zmk-dongle-screen
      remote: janpfischer
      revision: main
  self:
    path: config
