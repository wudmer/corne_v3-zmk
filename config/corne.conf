# Battery report interval in seconds
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=60

# Debounce: on Zephyr 4.1 these Kconfig symbols have unmet dependencies (debounce
# moved to devicetree properties on the kscan node) and ZMK now treats any Kconfig
# warning as fatal. The values were the ZMK defaults anyway.
#CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=5
#CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5

# Increase BLE radio transmission power to address latency and poor left/right communication issues
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Change default keyboard display name
CONFIG_ZMK_KEYBOARD_NAME="Clover [crkbd]"

# Fixes battery report related errors in Windows
CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=n

# OLED related configurations
# Enabled with the plain BUILT-IN status screen so each half shows whether it is
# powered and connected -- with the displays off there was no way to tell. The
# nice_oled shield is deliberately NOT in build.yaml: its animations were the
# annoying part, and as peripherals these OLEDs cannot show layer/typing info
# anyway (that lives on the Prospector).
#
# BUILT_IN implies the battery, output and peripheral-status (connection)
# widgets. BUILT_IN and CUSTOM are a Kconfig `choice` - only one may be set.
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_BUILT_IN=y

# Show the battery level as a number, not just the icon. On a peripheral the
# built-in screen can only show battery + connection state; layer, WPM and
# output status are gated to the central (the Prospector) by ZMK.
CONFIG_ZMK_WIDGET_BATTERY_STATUS_SHOW_PERCENTAGE=y

# Render on a dedicated thread so display work cannot stall key/BLE handling.
CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y

# Blank the OLED when idle to save the 18650s (default y for SSD1306; explicit).
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=y

# Sleep related configurations
# Milliseconds of inactivity before entering idle state (10 minutes)
CONFIG_ZMK_IDLE_TIMEOUT=600000

# Enable deep sleep support
# CONFIG_ZMK_SLEEP=y
# Milliseconds of inactivity before entering deep sleep (15 minutes).
# Commented out: it depends on ZMK_SLEEP, and assigning a symbol with unmet
# dependencies is a fatal Kconfig warning on Zephyr 4.1.
#CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# ZMK Studio related configurations
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n
CONFIG_ZMK_STUDIO_LOCK_ON_DISCONNECT=n

# RGB underglow related configurations
# NOTE: CONFIG_WS2812_STRIP is undefined on Zephyr 4.1 (the driver is enabled
# from the led_strip devicetree node) and an undefined symbol is a fatal Kconfig
# warning there, so it must stay out.
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_ZMK_RGB_UNDERGLOW_SAT_START=100
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=y
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y
CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=0
CONFIG_ZMK_RGB_UNDERGLOW_BRT_MAX=60
CONFIG_ZMK_RGB_UNDERGLOW_BRT_START=20
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=n
