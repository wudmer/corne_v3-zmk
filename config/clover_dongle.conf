# --- Prospector display ---
# Ambient light sensor is OFF by default so this builds whether or not your
# Prospector has the APDS9960 fitted. If you DID install the sensor and want
# auto-brightness, set the first line to =y and remove the fixed brightness line.
CONFIG_PROSPECTOR_USE_AMBIENT_LIGHT_SENSOR=n
CONFIG_PROSPECTOR_FIXED_BRIGHTNESS=40

# Render the LCD on a dedicated thread so heavy LVGL redraws don't block key/BLE
# processing on the main work queue (fixes layer/input lag and helps avoid
# watchdog reboots on the dongle).
CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y
# Uncomment if the display is mounted upside-down for your desk orientation:
# CONFIG_PROSPECTOR_ROTATE_DISPLAY_180=y

# Status screen layout (Classic is the default). Uncomment one to change:
# CONFIG_PROSPECTOR_STATUS_SCREEN_RADII=y
# CONFIG_PROSPECTOR_STATUS_SCREEN_FIELD=y
# CONFIG_PROSPECTOR_STATUS_SCREEN_OPERATOR=y

# --- ZMK Studio (runs on the central = dongle) ---
# TEMP DEBUG: Studio is disabled while the zmk-usb-logging snippet is active.
# Only ONE snippet can be passed by the build workflow, and ZMK_STUDIO selects
# ZMK_STUDIO_RPC which needs the studio-rpc-usb-uart snippet's UART node.
# To restore: uncomment these 3 lines and switch build.yaml's dongle snippet
# back to studio-rpc-usb-uart.
#CONFIG_ZMK_STUDIO=y
#CONFIG_ZMK_STUDIO_LOCKING=n
#CONFIG_ZMK_STUDIO_LOCK_ON_DISCONNECT=n

# TEMP DEBUG: delay log thread startup so boot-time messages aren't missed
# before the serial console is attached.
CONFIG_LOG_PROCESS_THREAD_STARTUP_DELAY_MS=4000

# --- BLE ---
# Boost TX power to match the halves' corne.conf setting.
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
