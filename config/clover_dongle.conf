# --- Dongle screen (zmk-dongle-screen module) ---
# No APDS9960 fitted on this build, so ambient light stays off (module default is
# already n) and brightness is fixed instead.
CONFIG_DONGLE_SCREEN_AMBIENT_LIGHT=n
CONFIG_DONGLE_SCREEN_MAX_BRIGHTNESS=40
CONFIG_DONGLE_SCREEN_DEFAULT_BRIGHTNESS=40

# Widgets. OUTPUT is the reason for moving to this module: it shows whether the
# dongle is on USB or BLE, and which BLE profile, colour-coded.
CONFIG_DONGLE_SCREEN_OUTPUT_ACTIVE=y
CONFIG_DONGLE_SCREEN_LAYER_ACTIVE=y
CONFIG_DONGLE_SCREEN_BATTERY_ACTIVE=y
CONFIG_DONGLE_SCREEN_MODIFIER_ACTIVE=y
CONFIG_DONGLE_SCREEN_WPM_ACTIVE=y

# The dongle is USB powered and has no cell of its own, so don't show a battery
# for it: CONFIG_ZMK_DONGLE_DISPLAY_DONGLE_BATTERY=y

# Screen orientation. Flip if the display ends up upside-down in the case.
CONFIG_DONGLE_SCREEN_HORIZONTAL=y
# CONFIG_DONGLE_SCREEN_FLIPPED=y

# Blank the screen after this many seconds of inactivity.
CONFIG_DONGLE_SCREEN_IDLE_TIMEOUT_S=600

# --- ZMK Studio (runs on the central = dongle) ---
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n
CONFIG_ZMK_STUDIO_LOCK_ON_DISCONNECT=n

# NOTE: to debug over serial, comment out the 3 Studio lines above and switch the
# dongle's snippet in build.yaml to zmk-usb-logging (only one snippet can be
# passed, and ZMK_STUDIO requires the studio-rpc-usb-uart node).

# --- BLE ---
# Boost TX power to match the halves' corne.conf setting.
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
